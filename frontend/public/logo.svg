<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#FFC96B"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8FD3F4"/>
      <stop offset="100%" stop-color="#3E8FD6"/>
    </linearGradient>
    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="200" height="200" rx="42"/>
    </clipPath>
  </defs>
  <g clip-path="url(#roundedSquare)">
    <rect x="0" y="0" width="200" height="200" fill="url(#paper)"/>
    <path d="M200 150 L200 200 L150 200 Z" fill="url(#fold)"/>
    <path d="M150 200 L200 150 L200 170 Q180 195 150 200 Z" fill="#FFE9A8" opacity="0.5"/>
  </g>
  <rect x="0.5" y="0.5" width="199" height="199" rx="42" fill="none" stroke="#E8A94A" stroke-width="1"/>
  <text x="30" y="110" font-family="'Segoe Print','Bradley Hand',cursive" font-size="40" font-weight="700" fill="#B5321F" transform="rotate(-6 30 110)">Scribe</text>
  <path d="M28 118 Q90 110 145 108" fill="none" stroke="#B5321F" stroke-width="4" stroke-linecap="round" transform="rotate(-6 30 110)"/>
</svg>
